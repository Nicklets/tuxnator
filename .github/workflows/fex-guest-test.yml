name: FEX guest CPU test

# Builds FEXCore's guest CPU bridge (libbbcpu.so) and its test from ARM_bloodborne_pc, to find out
# whether FEX runs on Android's 39-bit address space inside this app's Debian rootfs.

on:
  push:
    branches: [fex-guest-test]
  workflow_dispatch:

permissions:
  contents: read

env:
  ARM_REPO: https://github.com/Nicklets/OCTR-NitroFueled-arm.git
  ARM_REF: arm64-fex

jobs:
  # The game's port for aarch64: FEX runs its x86-64 code, the runtime and the renderer are native.
  port:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    container:
      image: debian:forky
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git clang lld llvm gcc g++ \
            cmake ninja-build pkg-config python3 file glslang-tools glslang-dev spirv-headers spirv-cross \
            libvulkan-dev libsdl3-dev libfmt-dev libboost-dev libmagicenum-dev robin-map-dev \
            libvulkan-memory-allocator-dev libxxhash-dev libx11-dev libxcb1-dev x11proto-dev \
            libwayland-dev libzydis-dev libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev liblzma-dev

      - name: Fetch the source
        run: |
          git clone --branch "$ARM_REF" "$ARM_REPO" /src
          git -C /src submodule update --init --recursive

      - name: Build the port
        working-directory: /src
        shell: bash
        run: |
          report() {
            code=$?
            for f in /tmp/port.log out/gpu-build.log out/fex-build.log; do [ -s "$f" ] && tail -n 40 "$f" > /tmp/tail.log; done
            [ "$code" = 0 ] || echo "::error::exit $code: $(grep -E 'error|Error|FAILED|undefined' /tmp/port.log /tmp/tail.log | tail -n 30 | tr -d '%' | tr -s '[:space:]' ' ' | tail -c 3800)"
          }
          trap report EXIT
          # build.sh keeps this configuration. FEX does not build with Debian's fmt, so it uses its own.
          CC=clang CXX=clang++ cmake -S third_party/FEX -B out/fex -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PROJECT_FEX_INCLUDE="$PWD/cpu/fex_project.cmake" \
            -DCMAKE_DISABLE_FIND_PACKAGE_fmt=ON \
            -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF -DBUILD_FEXCONFIG=OFF -DBUILD_STEAM_SUPPORT=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF -DENABLE_ZYDIS=OFF -DTUNE_ARCH=armv8.2-a -DTUNE_CPU=generic \
            > /tmp/port.log 2>&1
          BB_LTO=OFF bash build.sh >> /tmp/port.log 2>&1

      - name: Bundle
        working-directory: /src
        shell: bash
        run: |
          d=/bundle/ctr
          mkdir -p "$d/bin/gpu" "$d/bin/cpu" "$d/lib" "$d/tools/shaders" "$d/third_party"
          cp -r run.sh run.py scripts patches launcher "$d/"
          [ -d shaders ] && cp -r shaders "$d/"
          cp tools/gen_import_names.py "$d/tools/"; cp tools/shaders/build_spirv.py "$d/tools/shaders/"
          cp -r third_party/gcn2hlsl "$d/third_party/"
          cp out/VERSION "$d/"
          cp out/sacredfire out/bb-gpu-capabilities "$d/bin/"
          cp out/gpu/libbbgpu.so "$d/bin/gpu/"; cp out/fex/libbbcpu.so "$d/bin/cpu/"
          export LD_LIBRARY_PATH=$PWD/out/gpu:$PWD/out/fex
          ldd out/sacredfire | awk '/=> \//{print $3}' | sort -u | xargs -r cp -Ln -t "$d/lib/"
          cp -L /lib/ld-linux-aarch64.so.1 "$d/lib/"
          du -sh /bundle; ls "$d/lib" | wc -l

      - name: Upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ctr-arm64-bundle
          path: /bundle/
          if-no-files-found: warn
