name: FEX guest CPU test

# Builds FEXCore's guest CPU bridge (libbbcpu.so) and its test from ARM_bloodborne_pc, to find out
# whether FEX runs on Android's 39-bit address space inside this app's Debian rootfs.

on:
  push:
    branches: [fex-guest-test]
  workflow_dispatch:

permissions:
  contents: read

env:
  ARM_REPO: https://github.com/MaSieS4Fun/ARM_bloodborne_pc.git
  ARM_REF: 2b705bb6260b5229aff8f7dcd933b72c2c82acb2

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    # Same image as linux-rootfs.yml, so the binaries link against the rootfs's glibc.
    container:
      image: debian:forky
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git clang lld llvm gcc g++             cmake ninja-build pkg-config python3 file

      - name: Fetch the source
        run: |
          git clone "$ARM_REPO" /src
          git -C /src checkout "$ARM_REF"
          git -C /src submodule update --init --recursive third_party/FEX

      - name: Build libbbcpu
        working-directory: /src
        shell: bash
        # The same options as build.sh in that repository. Logs need a sign-in, annotations do not.
        run: |
          report() {
            code=$?
            [ "$code" = 0 ] || echo "::error::exit $code: $(tail -n 25 /tmp/fex.log | tr -d '%' | tr -s '[:space:]' ' ')"
          }
          trap report EXIT
          set -x
          type cmake ninja clang clang++ python3 > /tmp/fex.log 2>&1
          CC=clang CXX=clang++ cmake -S third_party/FEX -B out/fex -G Ninja             -DCMAKE_BUILD_TYPE=Release -DCMAKE_PROJECT_FEX_INCLUDE="$PWD/cpu/fex_project.cmake"             -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF -DBUILD_FEXCONFIG=OFF -DBUILD_STEAM_SUPPORT=OFF             -DBUILD_FEX_LINUX_TESTS=OFF -DENABLE_ZYDIS=OFF -DTUNE_ARCH=armv8.2-a -DTUNE_CPU=generic             >> /tmp/fex.log 2>&1
          ninja -C out/fex bbcpu >> /tmp/fex.log 2>&1

      - name: Build the test
        working-directory: /src
        run: |
          gcc -std=c11 -O2 -g -Wall -Wextra -pthread -Isrc tests/test_guest_cpu.c             -Lout/fex -lbbcpu -Wl,-rpath,'$ORIGIN' -o out/guest-cpu-test

      - name: Run on the runner
        working-directory: /src/out
        run: |
          cp fex/libbbcpu.so .
          file guest-cpu-test libbbcpu.so
          ./guest-cpu-test

      - name: Upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: fex-guest-test
          path: |
            /src/out/guest-cpu-test
            /src/out/libbbcpu.so
          if-no-files-found: warn

  # The whole port for aarch64: the renderer, the runtime and FEX, with every library they load,
  # to run bb-probe --vulkan-only inside the rootfs.
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    container:
      image: debian:forky
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git clang lld llvm gcc g++ \
            cmake ninja-build pkg-config python3 file glslang-tools glslang-dev spirv-headers spirv-cross \
            libvulkan-dev libsdl3-dev libfmt-dev libboost-dev libmagicenum-dev robin-map-dev \
            libvulkan-memory-allocator-dev libxxhash-dev libx11-dev libxcb1-dev x11proto-dev \
            libwayland-dev libzydis-dev libavformat-dev libavcodec-dev \
            libavutil-dev libswscale-dev libswresample-dev

      - name: Build what Debian does not package
        run: |
          git clone --depth 1 https://github.com/richgel999/miniz.git /miniz
          cmake -S /miniz -B /miniz/out -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          ninja -C /miniz/out install
          git clone --depth 1 https://github.com/herumi/xbyak.git /xbyak
          cp -r /xbyak/xbyak /usr/local/include/

      - name: Fetch the source
        run: |
          git clone "$ARM_REPO" /src
          git -C /src checkout "$ARM_REF"
          git -C /src submodule update --init --recursive

      - name: Build the port
        working-directory: /src
        shell: bash
        run: |
          report() {
            code=$?
            [ "$code" = 0 ] || echo "::error::exit $code: $(tail -n 30 /tmp/port.log | tr -d '%' | tr -s '[:space:]' ' ' | tail -c 3500)"
          }
          trap report EXIT
          # build.sh keeps this configuration. FEX does not build with Debian's fmt, so it uses its own.
          CC=clang CXX=clang++ cmake -S third_party/FEX -B out/fex -G Ninja             -DCMAKE_BUILD_TYPE=Release -DCMAKE_PROJECT_FEX_INCLUDE="$PWD/cpu/fex_project.cmake"             -DCMAKE_DISABLE_FIND_PACKAGE_fmt=ON             -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF -DBUILD_FEXCONFIG=OFF -DBUILD_STEAM_SUPPORT=OFF             -DBUILD_FEX_LINUX_TESTS=OFF -DENABLE_ZYDIS=OFF -DTUNE_ARCH=armv8.2-a -DTUNE_CPU=generic             > /tmp/port.log 2>&1
          BB_LTO=OFF bash build.sh >> /tmp/port.log 2>&1

      - name: Bundle
        working-directory: /src
        shell: bash
        run: |
          mkdir -p /bundle
          export LD_LIBRARY_PATH=$PWD/out/gpu:$PWD/out/fex
          cp out/bb-probe out/gpu/libbbgpu.so out/fex/libbbcpu.so /bundle/
          ldd out/bb-probe | awk '/=> \//{print $3}' | sort -u | xargs -r cp -Ln -t /bundle/
          cp -L /lib/ld-linux-aarch64.so.1 /bundle/
          du -sh /bundle; ls /bundle | wc -l

      - name: Upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: bb-probe-bundle
          path: /bundle/
          if-no-files-found: warn
